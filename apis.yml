name: Travelguru
description: >-
  Travelguru was an Indian online hotel-booking brand that grew into one of India's
  larger hotel-distribution platforms before Yatra.com acquired a 100% stake in July
  2012. The brand has since been folded into Yatra: travelguru.com and the Travel
  Partner Web hotel extranet now redirect to yatra.com, the former Desiya B2B
  distribution host is offline, and Travelguru publishes no standalone developer
  portal or public API surface today. It is tracked in the API Evangelist network
  as a Battery Ventures portfolio company.
